name: One line check
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
jobs:
  validate:
    name: One line and application tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce one new file and one line per account
        if: github.event_name == 'pull_request'
        id: contribution
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const pr = context.payload.pull_request;
            const files = await github.paginate(github.rest.pulls.listFiles, {owner, repo, pull_number: pr.number, per_page: 100});
            const name = `contributions/${pr.user.login.toLowerCase()}.js`;
            if (files.length !== 1 || files[0].filename !== name || files[0].status !== 'added' || files[0].additions !== 1 || files[0].deletions !== 0) {
              core.setFailed(`Ajoute uniquement une ligne dans le nouveau fichier ${name}.`); return;
            }
            const previous = await github.rest.search.issuesAndPullRequests({q:`repo:${owner}/${repo} is:pr is:merged author:${pr.user.login}`, per_page:1});
            if (previous.data.total_count > 0) { core.setFailed('Ce compte a déjà une contribution fusionnée.'); return; }
            core.setOutput('file', name);
      - name: Validate proposed contribution as data, without executing it
        if: github.event_name == 'pull_request'
        env:
          CONTRIBUTION_FILE: ${{ steps.contribution.outputs.file }}
        run: node scripts/check-contribution.cjs "$CONTRIBUTION_FILE"
      - name: Test schema and app interactions
        run: |
          node --check src/schema.js
          node --check src/experience.js
          node --test tests/*.test.cjs
