name: One line check
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
jobs:
  validate:
    name: One line and application tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate pull request shape
        if: github.event_name == 'pull_request'
        id: contribution
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const pr = context.payload.pull_request;
            const maintenance = pr.user.login.toLowerCase() === owner.toLowerCase() && pr.head.repo && pr.head.repo.full_name.toLowerCase() === `${owner}/${repo}`.toLowerCase() && pr.head.ref.startsWith('maintenance/');
            if (maintenance) {core.info('Owner maintenance PR: standard tests apply.'); return;}
            const files = await github.paginate(github.rest.pulls.listFiles, {owner, repo, pull_number: pr.number, per_page: 100});
            const name = `contributions/${pr.user.login.toLowerCase()}.js`;
            if (files.length !== 1 || files[0].filename !== name || files[0].status !== 'added' || files[0].additions !== 1 || files[0].deletions !== 0) {core.setFailed(`Ajoute uniquement une ligne dans le nouveau fichier ${name}.`);return;}
            core.setOutput('file', name);
      - name: Verify contributor line syntax without executing it
        if: steps.contribution.outputs.file != ''
        env:
          CONTRIBUTION_FILE: ${{ steps.contribution.outputs.file }}
        run: node scripts/check-contribution.cjs "$CONTRIBUTION_FILE"
      - name: Test app and build
        run: |
          node --check src/experience.js
          node --test tests/*.test.cjs
          node scripts/build.cjs
