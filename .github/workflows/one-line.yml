name: One line check
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: read
jobs:
  one-line:
    runs-on: ubuntu-latest
    steps:
      - name: Check contribution size and previous merged PRs
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const pr = context.payload.pull_request;
            const files = await github.paginate(github.rest.pulls.listFiles, {owner, repo, pull_number: pr.number, per_page: 100});
            if (files.length !== 1 || files[0].filename !== 'src/experience.js' || files[0].status !== 'modified' || files[0].additions !== 1 || files[0].deletions > 1) {
              core.setFailed('Une contribution doit ajouter ou remplacer exactement une ligne dans src/experience.js, sans modifier un autre fichier.');
              return;
            }
            const q = `repo:${owner}/${repo} is:pr is:merged author:${pr.user.login}`;
            const previous = await github.rest.search.issuesAndPullRequests({q, per_page: 1});
            if (previous.data.total_count > 0) core.setFailed('Ce compte a déjà une pull request fusionnée. Une seule contribution acceptée par personne.');
            else core.info('Vérification de base réussie. Une revue humaine reste nécessaire.');
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax without running contributed code
        run: node --check src/experience.js
